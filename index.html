<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="stylesheet.css">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <table align="center">
    
    <tr>
      <td align="center">
        <img src="./images/image-qr-code.png" width="245px" >
      </td>
    </tr>
    
    <tr>
      <td align="center ">
       <p class="first-line"> Improve your front-end <br> skills by building projects </p>
      </td> 
    </tr>  

    <tr>
      <td align="center">
        <p class="second-line">Scan the QR code to visit Frontend <br> Mentor and take your coding skills to <br> the next level</p>
      </td>
    </tr>

  </table>      
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/JohnLehrer">John Lehrer</a>.
  </footer>
</body>
</html>
